name: Check apps registry

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      file_changed: ${{ steps.check_modified.outputs.file_changed }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check if file was modified
        id: check_modified
        run: |
          set +eo pipefail
          git diff --name-only origin/main HEAD | grep -q "front/lib/registry.ts"
          if [ $? -eq 0 ]; then
            echo "file_changed=true" >> $GITHUB_OUTPUT
          else
            echo "file_changed=false" >> $GITHUB_OUTPUT
          fi

  validate:
    needs: check-changes
    runs-on: ubuntu-latest
    if: |
      needs.check-changes.outputs.file_changed == 'true'
    steps:
      # Check out the base branch (main) to use trusted code for validation
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.base_ref }}

      - name: Setup validation environment
        uses: actions/setup-node@v3
        with:
          node-version: 20.13.0
          cache: "npm"
          cache-dependency-path: ./front/package-lock.json

      - name: Build sdks/js
        working-directory: sdks/js
        run: npm install && npm run build

      # Fetch the PR's registry file to validate it
      - name: Fetch PR registry file
        run: |
          set -eo pipefail
          mkdir -p /tmp/pr-files
          gh api \
            -H "Accept: application/vnd.github.raw" \
            "/repos/${{ github.repository }}/contents/front/lib/registry.ts?ref=${{ github.event.pull_request.head.sha }}" \
            > /tmp/pr-files/registry.ts
        env:
          GH_TOKEN: ${{ github.token }}

      # Replace the base registry file with the PR version for validation
      - name: Replace registry file with PR version
        run: |
          cp /tmp/pr-files/registry.ts front/lib/registry.ts

      - name: Run validation
        id: validate
        working-directory: front
        run: |
          set -eo pipefail
          npm install
          npx tsx ./admin/check_registry_apps.ts --execute --url https://dust.tt --wId 78bda07b39 --spaceId vlt_rICtlrSEpWqX --apiKey ${{ secrets.DUST_APPS_US_API_KEY }}
          npx tsx ./admin/check_registry_apps.ts --execute --url https://eu.dust.tt --wId W1YzXC9nhN --spaceId vlt_p5kel5XkwVqEnpKcdXzC --apiKey ${{ secrets.DUST_APPS_EU_API_KEY }}
